<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narendra TODO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-shapes" aria-hidden="true">
    <span class="shape shape-1"></span>
    <span class="shape shape-2"></span>
    <span class="shape shape-3"></span>
</div>

<main class="app-shell">
    <header class="hero">
        <div>
            <p class="kicker">Monitoring Workspace</p>
            <h1>Narendra TODO</h1>
            <p class="subtitle">Track your tasks with focus, momentum, and signal.</p>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">Switch Theme</button>
    </header>

    <section class="panel form-panel">
        <h2>Create Task</h2>
        <form id="taskForm">
            <label class="field">
                <span>Task Title</span>
                <input id="title" name="title" maxlength="140" placeholder="Example: Check CPU alert thresholds" required>
            </label>

            <div class="field-grid">
                <label class="field">
                    <span>Status</span>
                    <select id="status" name="status">
                        <option value="TODO">Todo</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="DONE">Done</option>
                    </select>
                </label>

                <label class="field">
                    <span>Priority</span>
                    <select id="priority" name="priority">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </label>
            </div>

            <div class="action-row">
                <button class="primary" type="submit">Add Task</button>
                <p id="formMessage" class="message" aria-live="polite"></p>
            </div>
        </form>
    </section>

    <section class="panel list-panel">
        <div class="list-header">
            <h2>Tasks</h2>
            <button id="refreshBtn" class="ghost" type="button">Refresh</button>
        </div>
        <div id="taskList" class="task-list"></div>
    </section>

    <footer class="footer">Narendra TODO • Monitoring tasks in focus mode</footer>
</main>

<template id="taskTemplate">
    <article class="task-card">
        <div class="task-main">
            <input class="task-title" maxlength="140">
            <div class="pill-row">
                <select class="task-status">
                    <option value="TODO">Todo</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="DONE">Done</option>
                </select>
                <select class="task-priority">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
        </div>
        <div class="task-actions">
            <button class="save-btn ghost" type="button">Save</button>
            <button class="delete-btn danger" type="button">Delete</button>
        </div>
    </article>
</template>

<script src="app.js"></script>
</body>
</html>
